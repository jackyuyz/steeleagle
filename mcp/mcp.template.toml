# MCP module configuration for a single drone

[drone]
name = "drone1"
kernel = "unix:///tmp/kernel.sock"
telemetry = "ipc:///tmp/driver_telem.sock"
results = "ipc:///tmp/results.sock"

[mcp]
db_path = "mcp_mission.db"

[client]
# provider: "openai" or "anthropic".
provider = "openai"

# Model for the selected provider.
# OpenAI example:    "gpt-6.1-sol"
# Anthropic example: "claude-sonnet-4-20250514"
model = "gpt-6.1-sol"

# GPT-6.1 Sol defaults to medium and uses Responses for tool calls.
# This value is sent as reasoning.effort on Responses requests.
# Anthropic Messages has no reasoning_effort parameter; this setting is ignored.
# Claude uses separate thinking/output_config.effort controls where supported.
reasoning_effort = "medium"

# API key should be set via OPENAI_API_KEY or ANTHROPIC_API_KEY env var
#
# Environment variable (shell). Names are UPPERCASE:
#   export OPENAI_API_KEY=sk-...
#   export ANTHROPIC_API_KEY=sk-ant-...
#
# This file ([client] keys). Names are lowercase:
#   openai_api_key = "sk-..."
#   anthropic_api_key = "sk-ant-..."
#
# Chat/client resolution: value in this file > environment variable
